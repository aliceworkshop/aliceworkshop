# Weekly timetable shown on the Program page.
#
# Times are "H:MM" in 15-minute steps from `first_hour`. The grid ends with a
# single open row starting at `last_hour - 1` (e.g. "19.00 -"); anything that
# runs later keeps its real end time but is drawn only to the bottom of the grid.
# `type` picks the colour: social, plenary, tutorial, dg, panel, projects,
# food (breakfast, lunch, coffee), meal, outing, extra.
# A day's optional `width` sets its column width relative to the others.
# Optional fields per item:
#   location  shown under the title with a pin; "TBA" only appears in the
#             details card
#   note      an extra line under the location
#   icon      shown instead of the title (e.g. a coffee cup)
#   overlay   true to draw the item as a small card on top of whatever else is
#             scheduled then (list it after that item)
#   details   Markdown shown when the block is clicked
#   parallel  sessions running side by side, each with a `name` and optional
#             optional `label` (shorter text for the grid; &shy; marks where a
#             long name may break) and `details` (e.g. discussion groups)
#             A lane may also set its own `type`, `icon` and `location`.
#   lane_kind text shown above each parallel session's label

first_hour: 8
last_hour: 20
# Hours drawn as a thinner row (breakfast and lunch)
compact_hours: [8, 12]

